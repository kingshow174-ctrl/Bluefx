<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Blue FX — Connecting...</title>
<style>
  body { background:#0a0e17; color:#e6e9f0; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; padding:20px; text-align:center; }
</style>
</head>
<body>
<div><div id="msg">Connecting your Deriv account...</div><div id="continueBtn" style="display:none; margin-top:16px;"><a href="/" style="color:#2f6bff;">Continue to Blue FX →</a></div></div>
<script>
(async function () {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const state = params.get("state");
  const error = params.get("error");
  const msgEl = document.getElementById("msg");

  if (error) {
    msgEl.textContent = "Login was cancelled or denied: " + (params.get("error_description") || error);
    document.getElementById("continueBtn").style.display = "block";
    return;
  }

  const storedState = sessionStorage.getItem("bluefx_oauth_state");
  const codeVerifier = sessionStorage.getItem("bluefx_code_verifier");

  if (!code || !state || state !== storedState || !codeVerifier) {
    msgEl.textContent = "Login response didn't match — possible expired session. (code=" + !!code + ", state match=" + (state === storedState) + ", verifier=" + !!codeVerifier + ")";
    document.getElementById("continueBtn").style.display = "block";
    return;
  }

  try {
    const res = await fetch("/api/exchange-code", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        code,
        code_verifier: codeVerifier,
        redirect_uri: window.location.origin + "/callback",
      }),
    });
    const rawText = await res.text();
    let tokenData;
    try {
      tokenData = JSON.parse(rawText);
    } catch (parseErr) {
      msgEl.textContent = "Server returned a non-JSON response (status " + res.status + "): " + rawText.slice(0, 200);
      console.error("Raw response:", rawText);
      document.getElementById("continueBtn").style.display = "block";
      return;
    }
    if (!res.ok || !tokenData.access_token) {
      msgEl.textContent = "Token exchange failed: " + JSON.stringify(tokenData);
      console.error("Token exchange failed:", tokenData);
      document.getElementById("continueBtn").style.display = "block";
      return;
    }

    localStorage.setItem("bluefx_access_token", tokenData.access_token);
    msgEl.textContent = "Fetching your accounts...";

    const acctRes = await fetch("https://api.derivws.com/trading/v1/options/accounts", {
      headers: { "Authorization": "Bearer " + tokenData.access_token },
    });
    const acctData = await acctRes.json();
    console.log("Accounts response:", acctData);

    if (acctRes.ok && acctData.data) {
      const accounts = Array.isArray(acctData.data) ? acctData.data : [acctData.data];
      localStorage.setItem("bluefx_deriv_accounts", JSON.stringify(accounts));
      msgEl.textContent = "Connected! Redirecting...";
      sessionStorage.removeItem("bluefx_oauth_state");
      sessionStorage.removeItem("bluefx_code_verifier");
      setTimeout(() => { window.location.href = "/"; }, 1000);
    } else {
      msgEl.textContent = "Logged in, but couldn't list accounts: " + JSON.stringify(acctData);
      console.error("Accounts fetch failed:", acctData);
      document.getElementById("continueBtn").style.display = "block";
    }
  } catch (e) {
    msgEl.textContent = "Error during login: " + e.message;
    console.error(e);
    document.getElementById("continueBtn").style.display = "block";
  }
})();
</script>
</body>
</html>
